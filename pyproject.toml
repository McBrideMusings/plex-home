[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-home"
version = "0.1.0"
description = "Automatic home-screen collection pinner for Plex Media Server"
requires-python = ">=3.10"
dependencies = [
    "plexapi",
    "requests",
    "pyyaml",
    # zoneinfo reads the system tz database, which slim container images do not
    # ship; this is the pure-Python fallback it looks up when that is missing, so
    # cadence.timezone resolves the same in Docker as on a dev machine.
    "tzdata",
]

[project.scripts]
plex-home = "plex_home.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
